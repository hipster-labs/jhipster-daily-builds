name: Official Windows
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ github.event.inputs.jhiGenRepo }}-${{ github.event.inputs.jhiGenBranch }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      jhiGenRepo:
        description: 'JHipster repository url'
        default: 'jhipster/generator-jhipster'
        required: false
      jhiGenBranch:
        description: 'JHipster repository branch'
        default: 'main'
        required: false
  schedule:
    - cron: '0 9 * * *'
jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: 'SETUP: Checkout generator-jhipster'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.jhiGenRepo || 'jhipster/generator-jhipster' }}
          ref: ${{ github.event.inputs.jhiGenBranch || 'main' }}
      - run: echo "node-version=$(cat ${{ github.workspace }}/generators/init/resources/.node-version)" >> $GITHUB_OUTPUT
        id: node-version
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-version.outputs.node-version }}
      - run: npm ci --production --engine-strict --ignore-scripts
      - id: build
        run: bin/jhipster.cjs github-build-matrix daily-windows --event-name daily
  applications:
    name: ${{ matrix.job-name }}
    runs-on: ${{ matrix.os }}
    needs: build-matrix
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/app
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    steps:
      #----------------------------------------------------------------------
      # Install all tools and check configuration
      #----------------------------------------------------------------------
      - name: 'SETUP: Checkout jhipster-daily-builds'
        uses: actions/checkout@v7
        with:
          path: jhipster-daily-builds
      - name: 'SETUP: Checkout generator-jhipster'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.jhiGenRepo || 'jhipster/generator-jhipster' }}
          path: generator-jhipster
          ref: ${{ github.event.inputs.jhiGenBranch || 'main' }}
      - uses: jhipster/actions/setup-runner@v2
        with:
          node-version: ${{ matrix.node-version }}
          java-version: ${{ matrix.java-version }}
          npm-version: ${{ matrix.npm-version }}
          maven-cache: true
          gradle-cache: ${{ matrix.gradle-cache }}
          binary-dir: ${{ github.workspace }}/generator-jhipster/bin
      #----------------------------------------------------------------------
      # Install JHipster and generate project+entities
      #----------------------------------------------------------------------
      - run: npm ci --ignore-scripts
        working-directory: ${{ github.workspace }}/generator-jhipster
      - run: jhipster.cjs ci-utils --export-github-output
        id: jhipster-output
      - uses: jhipster/actions/build-jhipster-bom@v2
        with:
          jhipster-bom-ref: ${{ steps.jhipster-output.outputs.jhipster-bom-branch }}
      - run: jhipster.cjs generate-sample ${{ matrix.sample }} --skip-jhipster-dependencies --skip-checks --no-insight
        env:
          JHIPSTER_DEPENDENCIES_VERSION: ${{ matrix.jhipster-bom-cicd-version }}
          JHI_JWT_SECRET_KEY: ${{ matrix.jwt-secret-key }}
      - run: npm config -L project set script-shell=bash
      #----------------------------------------------------------------------
      # Launch tests
      #----------------------------------------------------------------------
      - run: npm run ci:backend:test
      - run: npm run ci:frontend:test --if-present
      - run: npm run ci:e2e:package
